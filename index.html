<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="stylesheet" href="loja.css">
</head>
<body>
  <div class="login-page">
    <div class="login-card">
      <h1>Faça seu Login</h1>
      <p>Entre com seu usuário e senha para acessar.</p>
<form id="loginForm">
        <div class="form-group">
          <label for="username">Usuário</label>
          <input type="text" id="username" name="username" placeholder="Digite seu usuário" required>
        </div>
        <div class="form-group">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Digite sua senha" required>
        </div>
        <button type="submit">Entrar</button>
        <p class="login-hint">Use qualquer usuário para testar. Senha mínima: 4 caracteres.</p>
      </form>
      <h5>Obrigado por comprar na nossa loja!</h5>
          <h6>

                    <a href="https://www.instagram.com/maliperfumaria_/reel/DYYDojDu-00/ "> Seja bem vindo.</a>
                 </p>
            </div>
          </h6>
